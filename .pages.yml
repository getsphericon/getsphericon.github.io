# Config for Pages CMS (https://pagescms.org): a web editor over this repository.
# Sign in with GitHub, pick this repo, and edit content without touching code.
media:
  input: public/images
  output: /images
content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: '{primary}.md'
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: draft, label: Draft (hidden from the site), type: boolean, default: true }
      - { name: body, label: Body, type: rich-text }
  - name: releases
    label: Release notes
    type: collection
    path: src/content/releases
    filename: '{primary}.md'
    view:
      fields: [version, title, date, draft]
      primary: version
      sort: [date]
    fields:
      - { name: version, label: Version, type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: draft, label: Draft (hidden from the site), type: boolean, default: true }
      - { name: body, label: Body, type: rich-text }
  - name: docs
    label: Documentation
    type: collection
    path: src/content/docs/docs
    filename: '{primary}.md'
    view:
      fields: [title]
      primary: title
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: body, label: Body, type: rich-text }
